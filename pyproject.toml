[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "axis"
version = "0.1.0"
description = "AXIS Discord MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "aiohttp>=3.12,<4",
  "asyncpg>=0.30,<1",
  "certifi>=2025.8,<2027",
  "discord.py>=2.6,<3",
  "jsonschema>=4.23,<5",
  "moomoo-api==10.10.7008",
  "openai>=2.0,<3",
  "Pillow>=11.3,<13",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy[asyncio]>=2.0.43,<3",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
