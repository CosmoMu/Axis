version: 1
provider: openai
api: responses

# Never hard-code one global model into business services.
# All workloads resolve through this router.

defaults:
  model: gpt-5.6-terra
  timeout_seconds: 45
  max_retries: 2

workloads:
  SIGNAL_PARSE:
    model: gpt-5.6-terra
    reasoning: low
    prompt_version: axis-trade-parse-v1
    schema_version: axis-trade-v1
    structured_output: llm_trade_schema.json

  SIGNAL_REPAIR:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-trade-repair-v1
    schema_version: axis-trade-v1
    structured_output: llm_trade_schema.json

  ANALYSIS_PARSE:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-analysis-parse-v5
    schema_version: axis-analysis-v4
    structured_output: llm_analysis_schema.json
    # Future option after MVP validation: gpt-5.6-sol

  ANALYSIS_REWRITE:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-analysis-rewrite-v5
    schema_version: axis-analysis-v4
    structured_output: llm_analysis_schema.json
    # Future option after MVP validation: gpt-5.6-sol

# LAB workloads are intentionally not configured for execution yet.
# Re-evaluate model selection when AXIS LAB development begins.
