version: 6
# AXIS Current Spec v2.1. Stable keys intentionally preserve existing saved Discord IDs.
brand:
  server_name: "AXIS"
  tagline: "Signals without the noise."
  accent_hex: "#86F7A8"
  logo_path: "assets/axis-logo.png"

roles:
  - key: bot
    name: "AXIS BOT"
    managed_by_discord: true
    hoist: false
    mentionable: false
  - key: manager
    name: "Manager"
    color_hex: "#F2F4EF"
    hoist: false
    mentionable: false
  - key: member
    name: "Member"
    color_hex: "#86F7A8"
    hoist: false
    mentionable: false
  - key: newcomer
    name: "Newcomer"
    color_hex: "#6B7280"
    hoist: false
    mentionable: false

role_order:
  - bot
  - manager
  - member
  - newcomer
  - everyone

categories:
  - key: start
    name: "⬛・公共区域"
    position: 0
    channels:
      - key: welcome
        name: "👋・欢迎"
        type: text
        topic: "AXIS 欢迎入口。点击申请加入 AXIS 后提交入群申请。"
        everyone_view: true
        everyone_send: false
        newcomer_view: true
        newcomer_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: subscriptions
        name: "💳・会员订阅"
        type: text
        topic: "查看单日通行证、月度会员与会员账户管理。"
        everyone_view: true
        everyone_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: official_results
        name: "📊・官方战绩"
        type: text
        topic: "AXIS 系统追踪的已完成订单与官方战绩。"
        everyone_view: true
        everyone_send: false
        newcomer_view: true
        newcomer_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: lobby
        name: "💬・公共交流"
        type: text
        topic: "公开市场交流、AXIS 讨论与常见问题。"
        everyone_view: true
        everyone_send: true
        member_send: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true
      - key: member_wins
        name: "🏆・会员分享"
        type: text
        topic: "会员自主分享；不计入 AXIS 官方战绩统计。"
        everyone_view: true
        everyone_send: true
        everyone_attach: true
        newcomer_view: true
        newcomer_send: false
        newcomer_attach: false
        member_send: true
        member_attach: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true
        bot_pin_messages: true

  - key: members
    name: "🟢・会员专区"
    position: 1
    default_visibility: member
    channels:
      - key: short_term_alerts
        name: "⚡・短线"
        type: text
        topic: "短线交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
        bot_pin_messages: true
      - key: swing_alerts
        name: "〽️・波段"
        type: text
        topic: "波段交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: leaps_alerts
        name: "♾️・长期"
        type: text
        topic: "长期和 LEAPS 交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: spxw_0dte
        name: "📍・spxw-0dte"
        type: text
        topic: "SPXW 0DTE 市场结构评分。仅 Bot 发布；不构成交易信号。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_inherit: true
        bot_send: true
        bot_pin_messages: true
      - key: manual_alerts
        name: "📣・人工喊单"
        type: text
        topic: "会员与管理员人工发布交易观察。"
        everyone_view: false
        member_view: true
        member_send: true
        manager_view: true
        manager_send: true
        bot_inherit: true
        bot_send: true
      - key: member_chat
        name: "🛋️・会员交流"
        type: text
        topic: "会员专属交流。"
        everyone_view: false
        member_view: true
        member_send: true
        manager_view: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true

  - key: manager
    name: "⚙️・管理后台"
    position: 2
    default_visibility: manager
    channels:
      - key: signal_input
        name: "📥・信号输入"
        type: text
        topic: "管理员提交原始文字、截图和交易更新。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: card_review
        name: "✅・信号审核"
        type: text
        topic: "LLM 草稿、Mentor 选择、编辑、预览和确认发布。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: analysis_input
        name: "💭・观点输入"
        type: text
        topic: "Mentor 市场观点的文字与图片输入。Analysis 功能在 Gate A 前保持关闭。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: analysis_review
        name: "📝・观点审核"
        type: text
        topic: "Analysis 草稿审核、归档与发布。Analysis 功能在 Gate A 前保持关闭。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: mentor_control
        name: "🧭・导师管理"
        type: text
        topic: "动态 Mentor Registry 和每位 Mentor 的订单状态。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: member_control
        name: "👤・会员管理"
        type: text
        topic: "会员赠送、延期、到期取消和立即移除。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: results_review
        name: "📋・战绩审核"
        type: text
        topic: "Daily Results Draft、Include / Exclude、Preview 与正式发布控制。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: false
        manager_interact: true
        bot_send: true
      - key: join_review
        name: "🛂・入群审核"
        type: text
        topic: "新成员入群申请、安全信息与管理员审核。"
        everyone_view: false
        member_view: false
        newcomer_view: false
        manager_view: true
        manager_send: false
        manager_interact: true
        owner_view: true
        owner_send: false
        owner_interact: true
        bot_send: true
      - key: manager_lounge
        name: "🤫・管理交流"
        type: text
        topic: "AXIS Manager 私人交流频道。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        manager_manage_messages: true
        bot_send: true
      - key: system_alerts
        name: "🚨・系统警报"
        type: text
        topic: "AXIS 生产系统 ERROR、WARNING 与 RECOVERY；正常运行时保持安静。"
        everyone_view: false
        member_view: false
        manager_view: false
        owner_view: true
        owner_send: true
        owner_attach: true
        owner_interact: true
        owner_manage_messages: true
        bot_send: true
      - key: card_testing
        name: "🧪・卡片测试"
        type: text
        topic: "AXIS Owner 测试卡片专用频道；测试不得写入正式交易或会员频道。"
        everyone_view: false
        member_view: false
        manager_view: false
        manager_send: false
        manager_attach: false
        manager_interact: false
        manager_manage_messages: false
        owner_view: true
        owner_send: true
        owner_attach: true
        owner_interact: true
        owner_manage_messages: true
        bot_send: true

  - key: lab
    name: "🧪・AXIS LAB"
    position: 3
    default_visibility: deferred
    feature_flag: FEATURE_LAB_ENABLED
    channels:
      - key: moomoo_trading
        name: "💹・交易控制"
        type: text
        topic: "仅 Owner 使用的个人交易控制、对账与审计。"
        everyone_view: false
        everyone_send: false
        member_view: false
        member_send: false
        manager_view: false
        manager_send: false
        newcomer_view: false
        newcomer_send: false
        owner_view: true
        owner_send: true
        owner_attach: true
        owner_interact: true
        owner_manage_messages: true
        bot_send: true
      - key: lab_signals
        name: "🟢・模型信号"
        type: text
        topic: "Model A/B 和 Moomoo 后续生成的私人模型信号。"
        everyone_view: false
        member_view: false
        manager_view: false
        bot_send: true
      - key: mentor_status
        name: "🧬・导师状态"
        type: text
        topic: "未来 Mentor 模型状态预留。当前功能禁用。"
        everyone_view: false
        member_view: false
        manager_view: false
        bot_send: true
      - key: lab_history
        name: "🗂️・历史订单"
        type: text
        topic: "模型历史订单、未触发信号和每日收盘总结。"
        everyone_view: false
        member_view: false
        manager_view: false
        bot_send: true

persistent_panels:
  - key: moomoo_trading_panel
    channel_key: moomoo_trading
  - key: mentor_control_panel
    channel_key: mentor_control
  - key: member_control_panel
    channel_key: member_control

active_button_custom_ids:
  swing: "axis:active:swing:v1"
  leaps: "axis:active:leaps:v1"
