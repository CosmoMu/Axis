version: 1
brand:
  server_name: "AXIS"
  tagline: "Signals without the noise."
  accent_hex: "#86F7A8"
  logo_path: "assets/axis-icon.png"
  brand_lockup_path: "assets/axis-brand-lockup.png"

roles:
  - key: bot
    name: "AXIS BOT"
    managed_by_discord: true
    hoist: false
    mentionable: false
  - key: manager
    name: "管理员"
    color_hex: "#F2F4EF"
    hoist: false
    mentionable: false
  - key: member
    name: "会员"
    color_hex: "#86F7A8"
    hoist: false
    mentionable: false

role_order:
  - bot
  - manager
  - member
  - everyone

categories:
  - key: start
    name: "01｜⬛ 开始"
    position: 10
    channels:
      - key: welcome
        name: "👋・欢迎"
        type: text
        topic: "AXIS 欢迎与使用说明。"
        everyone_view: true
        everyone_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: subscriptions
        name: "💳・订阅"
        type: text
        topic: "会员权益、订阅链接与订阅管理。"
        everyone_view: true
        everyone_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: official_results
        name: "📊・官方战绩"
        type: text
        topic: "系统追踪的关闭订单和官方统计。"
        everyone_view: true
        everyone_send: false
        member_send: false
        manager_send: false
        bot_send: true
      - key: lobby
        name: "💬・大厅"
        type: text
        topic: "公开交流与产品问题。"
        everyone_view: true
        everyone_send: true
        member_send: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true
      - key: member_wins
        name: "🏆・会员晒单"
        type: text
        topic: "会员自行分享的交易记录，不计入官方战绩。"
        everyone_view: true
        everyone_send: false
        member_send: true
        member_attach: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true

  - key: members
    name: "02｜🟢 会员"
    position: 20
    default_visibility: member
    channels:
      - key: short_term_alerts
        name: "⚡・短线信号"
        type: text
        topic: "短线交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: swing_alerts
        name: "〽️・波段信号"
        type: text
        topic: "波段交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: leaps_alerts
        name: "♾️・长期信号"
        type: text
        topic: "长期和 LEAPS 交易信号。仅 Bot 发布。"
        everyone_view: false
        member_view: true
        member_send: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: member_chat
        name: "💬・会员交流"
        type: text
        topic: "会员专属交流。"
        everyone_view: false
        member_view: true
        member_send: true
        manager_view: true
        manager_send: true
        manager_manage_messages: true
        bot_send: true

  - key: manager
    name: "90｜⚙️ 管理"
    position: 90
    default_visibility: manager
    channels:
      - key: signal_input
        name: "📥・信号输入"
        type: text
        topic: "管理员提交原始文字、截图和交易更新。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: card_review
        name: "✅・卡片审核"
        type: text
        topic: "LLM 草稿、Mentor 选择、编辑、预览和确认发布。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: true
        manager_attach: true
        bot_send: true
      - key: mentor_control
        name: "🧭・导师管理"
        type: text
        topic: "动态 Mentor Registry 和每位 Mentor 的订单状态。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: false
        bot_send: true
      - key: member_control
        name: "👤・会员管理"
        type: text
        topic: "会员赠送、延期、到期取消和立即移除。"
        everyone_view: false
        member_view: false
        manager_view: true
        manager_send: false
        bot_send: true

  - key: lab
    name: "99｜🧪 AXIS LAB"
    position: 99
    default_visibility: owner_only
    feature_flag: FEATURE_LAB_ENABLED
    channels:
      - key: lab_signals
        name: "🟢・模型信号"
        type: text
        topic: "Model A/B 和 Moomoo 后续生成的私人模型信号。"
        everyone_view: false
        member_view: false
        manager_view: false
        owner_view: true
        bot_send: true
      - key: lab_history
        name: "🗂️・历史订单"
        type: text
        topic: "模型历史订单、未触发信号和每日收盘总结。"
        everyone_view: false
        member_view: false
        manager_view: false
        owner_view: true
        bot_send: true

persistent_panels:
  - key: mentor_control_panel
    channel_key: mentor_control
  - key: member_control_panel
    channel_key: member_control

active_button_custom_ids:
  short_term: "axis:active:short_term:v1"
  swing: "axis:active:swing:v1"
  leaps: "axis:active:leaps:v1"
