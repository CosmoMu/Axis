version: AXIS_RESEARCH_V1
runtime:
  total_timeout_seconds: 120
  agent_timeout_seconds: 45
  max_llm_calls: 7
  max_debate_rounds: 1
  cache_seconds: 300
  user_cooldown_seconds: 30
  guild_fresh_limit_per_minute: 6
  max_concurrent_runs: 2
  as_of_bucket_seconds: 300
coverage:
  minimum_optional_components: 2
  component_weights:
    technical: 0.30
    gex: 0.20
    fundamentals: 0.20
    news_macro: 0.20
    sentiment: 0.10
confidence:
  weights:
    coverage: 0.25
    agreement: 0.20
    scenario_dominance: 0.20
    freshness: 0.15
    inverse_conflict: 0.10
    inverse_risk: 0.10
memory:
  same_ticker_limit: 3
  cross_ticker_limit: 2
  outcome_horizons: [1, 3, 5]
providers:
  request_timeout_seconds: 15
  max_news_items: 12
  max_source_text_chars: 1200
  benchmark_ticker: SPY
