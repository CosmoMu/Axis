version: 1
provider: openai
api: responses

# Never hard-code one global model into business services.
# All workloads resolve through this router.

defaults:
  model: gpt-5.6-terra
  timeout_seconds: 45
  max_retries: 2

workloads:
  SIGNAL_PARSE:
    model: gpt-5.6-terra
    reasoning: low
    prompt_version: axis-trade-parse-v5
    schema_version: axis-trade-v3
    structured_output: llm_trade_schema.json

  SIGNAL_REPAIR:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-trade-repair-v5
    schema_version: axis-trade-v3
    structured_output: llm_trade_schema.json

  ANALYSIS_PARSE:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-analysis-parse-v7
    schema_version: axis-analysis-v5
    structured_output: llm_analysis_schema.json
    # Future option after MVP validation: gpt-5.6-sol

  ANALYSIS_REWRITE:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-analysis-rewrite-v7
    schema_version: axis-analysis-v5
    structured_output: llm_analysis_schema.json
    # Future option after MVP validation: gpt-5.6-sol

  RESEARCH_BULL:
    model: gpt-5.6-luna
    reasoning: low
    prompt_version: axis-research-bull-v2-zh
    schema_version: axis-research-case-v1
    structured_output: llm_research_case_schema.json

  RESEARCH_BEAR:
    model: gpt-5.6-luna
    reasoning: low
    prompt_version: axis-research-bear-v2-zh
    schema_version: axis-research-case-v1
    structured_output: llm_research_case_schema.json

  RESEARCH_MANAGER:
    model: gpt-5.6-terra
    reasoning: high
    prompt_version: axis-research-manager-v2-zh
    schema_version: axis-research-manager-v1
    structured_output: llm_research_manager_schema.json

  RESEARCH_RISK_AGGRESSIVE:
    model: gpt-5.6-luna
    reasoning: low
    prompt_version: axis-research-risk-aggressive-v2-zh
    schema_version: axis-research-risk-v1
    structured_output: llm_research_risk_schema.json

  RESEARCH_RISK_NEUTRAL:
    model: gpt-5.6-luna
    reasoning: low
    prompt_version: axis-research-risk-neutral-v2-zh
    schema_version: axis-research-risk-v1
    structured_output: llm_research_risk_schema.json

  RESEARCH_RISK_CONSERVATIVE:
    model: gpt-5.6-luna
    reasoning: low
    prompt_version: axis-research-risk-conservative-v2-zh
    schema_version: axis-research-risk-v1
    structured_output: llm_research_risk_schema.json

  RESEARCH_SYNTHESIS:
    model: gpt-5.6-terra
    reasoning: high
    prompt_version: axis-research-synthesis-v2-zh
    schema_version: axis-research-synthesis-v1
    structured_output: llm_research_synthesis_schema.json

  RESEARCH_REFLECTION:
    model: gpt-5.6-terra
    reasoning: medium
    prompt_version: axis-research-reflection-v2-zh
    schema_version: axis-research-reflection-v1
    structured_output: llm_research_reflection_schema.json

# Research is an isolated read-only production module, not AXIS LAB.
# LAB workloads are intentionally not configured for execution yet.
# Re-evaluate model selection when AXIS LAB development begins.
